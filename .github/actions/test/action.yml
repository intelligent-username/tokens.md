name: "Test Suite (Backend & Frontend)"
description: "Runs backend pytest and frontend vitest via scripts/test.py"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv venv
        uv pip install -e ".[dev]"
        cd frontend && npm ci && cd ..

    - name: Run test runner script
      shell: bash
      run: |
        python scripts/test.py -v
