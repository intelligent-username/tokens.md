name: "Publish to PyPI"
description: "Syncs version with release tag, builds sdist & wheel, and uploads to PyPI."

inputs:
  pypi_token:
    description: "PyPI API Token"
    required: true
  skip_existing:
    description: "Skip packages that already exist on PyPI"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Sync pyproject.toml with Release Tag
      shell: bash
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        if [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$GITHUB_REF" ]; then
          echo "Syncing pyproject.toml and source files to release tag version: $TAG_VERSION"
          python -c "import pathlib, re; p = pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'version\s*=\s*[\"\'][^\"\']+[\"\']', f'version = \"$TAG_VERSION\"', p.read_text(encoding='utf-8')), encoding='utf-8')"
          python scripts/sync_version.py
        fi

    - name: Build sdist and wheel
      shell: bash
      run: |
        pip install --upgrade build
        python -m build --outdir dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ inputs.pypi_token }}
        packages-dir: dist/
        skip-existing: ${{ inputs.skip_existing == 'true' }}
