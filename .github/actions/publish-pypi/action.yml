name: "Publish to PyPI"
description: "Syncs version with release tag, builds sdist & wheel, and uploads to PyPI."

inputs:
  pypi_token:
    description: "PyPI API Token"
    required: true
  skip_existing:
    description: "Skip packages that already exist on PyPI"
    required: false
    default: "true"
  tag:
    description: "Explicit release tag/version override"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Sync pyproject.toml with Release Tag
      shell: bash
      run: |
        TAG_INPUT="${{ inputs.tag }}"
        TAG_VERSION=""
        if [ -n "$TAG_INPUT" ]; then
          TAG_VERSION="${TAG_INPUT#v}"
        elif [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/v}" ]; then
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        fi

        if [ -n "$TAG_VERSION" ]; then
          echo "Syncing pyproject.toml and source files to release tag version: $TAG_VERSION"
          python -c "import pathlib, re; p = pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'version\s*=\s*[\"\'][^\"\']+[\"\']', f'version = \"$TAG_VERSION\"', p.read_text(encoding='utf-8')), encoding='utf-8')"
          python scripts/sync_version.py
        fi

    - name: Build sdist and wheel
      shell: bash
      run: |
        pip install --upgrade build twine
        python -m build --outdir dist/

    - name: Publish to PyPI
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.pypi_token }}
        TWINE_NON_INTERACTIVE: "true"
      run: |
        SKIP_FLAG=""
        if [ "${{ inputs.skip_existing }}" = "true" ]; then
          SKIP_FLAG="--skip-existing"
        fi
        twine upload $SKIP_FLAG dist/*
