name: "Submit Formula to Homebrew Core"
description: "Submits or bumps the formula PR directly to Homebrew/homebrew-core without requiring a custom tap repository."

inputs:
  homebrew_token:
    description: "GitHub Personal Access Token with public_repo scope"
    required: true
  formula_path:
    description: "Source formula file path"
    required: false
    default: "manifests/homebrew/tmd.rb"

runs:
  using: "composite"
  steps:
    - name: Submit / Bump Formula to Homebrew Core
      shell: bash
      env:
        HOMEBREW_GITHUB_API_TOKEN: ${{ inputs.homebrew_token }}
        FORMULA_PATH: ${{ inputs.formula_path }}
      run: |
        if [ -z "$HOMEBREW_GITHUB_API_TOKEN" ]; then
          echo "::error::GitHub token with public_repo scope is required."
          exit 1
        fi

        if [ ! -f "$FORMULA_PATH" ]; then
          echo "::error::Formula file not found at $FORMULA_PATH"
          exit 1
        fi

        VERSION=$(grep -E "^\s*version\s+" "$FORMULA_PATH" | awk '{print $2}' | tr -d '"')
        echo "Submitting formula for version $VERSION to Homebrew Core..."

        # Extract SHA-256 for macos arm64
        SHA256=$(grep -A 10 "on_macos" "$FORMULA_PATH" | grep "sha256" | head -n 1 | awk '{print $2}' | tr -d '"')

        brew bump-formula-pr \
          --new-formula \
          --url="https://github.com/intelligent-username/tokens.md/releases/download/v${VERSION}/tmd-macos-arm64" \
          --sha256="$SHA256" \
          --no-audit \
          --no-browse \
          tmd || echo "::warning::brew bump-formula-pr exited with code $?. Check if PR already exists on Homebrew/homebrew-core."
