name: "Publish to Homebrew Tap"
description: "Syncs manifests/homebrew/tmd.rb into the user's homebrew-tap repository."

inputs:
  tap_token:
    description: "GitHub Personal Access Token with repo scope for homebrew-tap"
    required: true
  tap_repo:
    description: "Target tap repository (e.g. intelligent-username/homebrew-tap)"
    required: false
    default: "intelligent-username/homebrew-tap"
  formula_path:
    description: "Source formula file path"
    required: false
    default: "manifests/homebrew/tmd.rb"

runs:
  using: "composite"
  steps:
    - name: Push Formula to Homebrew Tap
      shell: bash
      env:
        TAP_TOKEN: ${{ inputs.tap_token }}
        TAP_REPO: ${{ inputs.tap_repo }}
        FORMULA_PATH: ${{ inputs.formula_path }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::error::HOMEBREW_TAP_TOKEN is not configured."
          exit 1
        fi

        if [ ! -f "$FORMULA_PATH" ]; then
          echo "::error::Formula file not found at $FORMULA_PATH"
          exit 1
        fi

        echo "Syncing $FORMULA_PATH to https://github.com/$TAP_REPO..."
        
        TMP_DIR=$(mktemp -d)
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TMP_DIR"
        
        mkdir -p "$TMP_DIR/Formula"
        cp "$FORMULA_PATH" "$TMP_DIR/Formula/tmd.rb"
        
        cd "$TMP_DIR"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if [ ! -f "README.md" ]; then
          printf "# Homebrew Tap for tmd\n\nOfficial Homebrew tap for [\`tmd\`](https://github.com/intelligent-username/tokens.md).\n\n## Installation\n\n\`\`\`bash\nbrew install intelligent-username/tap/tmd\n\`\`\`\n\n## Update\n\n\`\`\`bash\nbrew update\nbrew upgrade tmd\n\`\`\`\n" > README.md
          git add README.md
        fi

        git add Formula/tmd.rb
        
        if git diff --staged --quiet; then
          echo "Homebrew tap formula is already up to date. No changes to commit."
        else
          git commit -m "chore(formula): update tmd formula for release"
          git branch -M main
          git push -u origin main || git push origin HEAD
          echo "Successfully pushed updated formula to $TAP_REPO."
        fi
