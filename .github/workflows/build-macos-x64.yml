name: Build macOS Intel x64

on:
  workflow_call:

jobs:
  build:
    name: Build (macOS / x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Configure Compiler Caches
        shell: bash
        run: |
          echo "PYTHONUNBUFFERED=1" >> $GITHUB_ENV
          echo "CC=sccache clang" >> $GITHUB_ENV
          echo "CXX=sccache clang++" >> $GITHUB_ENV

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Nuitka
            ~/.cache/Nuitka
            .nuitka
          key: nuitka-macos-x64-${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: |
            nuitka-macos-x64-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary nuitka ordered-set zstandard -e .

      - name: Build binary
        run: |
          python -m nuitka \
            --onefile \
            --output-filename=tmd-macos-x64 \
            --include-package=src \
            --include-package=backend \
            --nofollow-imports \
            --assume-yes-for-downloads \
            --jobs=4 \
            --linux-onefile-icon=assets/tmd.png \
            tmd_runner.py

      - name: Smoke test
        shell: bash
        run: |
          ./tmd-macos-x64 --version
          ./tmd-macos-x64 --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmd-macos-x64
          path: tmd-macos-x64
