name: Verify Version Checker

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Check Version Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version alignment & sync manifests
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          
          echo "Git Tag Version: $TAG_VERSION"
          echo "pyproject.toml Version: $PYPROJECT_VERSION"
          
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::warning title=Version Mismatch::Git tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)!"
          else
            echo "Version tag and pyproject.toml are aligned."
          fi

          python scripts/sync_version.py
