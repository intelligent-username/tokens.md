name: Build Windows ARM64

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows / ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Configure Compiler Caches
        shell: bash
        run: |
          echo "PYTHONUNBUFFERED=1" >> $GITHUB_ENV
          echo "CC=sccache cl" >> $GITHUB_ENV
          echo "CXX=sccache cl" >> $GITHUB_ENV

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka/Cache
            .nuitka
          key: nuitka-windows-arm64-${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: |
            nuitka-windows-arm64-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary nuitka ordered-set zstandard -e .

      - name: Build binary
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --output-filename=tmd-windows-arm64.exe `
            --include-package=src `
            --include-package=backend `
            --nofollow-imports `
            --assume-yes-for-downloads `
            --jobs=4 `
            --windows-icon-from-ico=assets/tmd.ico `
            tmd_runner.py

      - name: Smoke test
        shell: bash
        run: |
          ./tmd-windows-arm64.exe --version
          ./tmd-windows-arm64.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmd-windows-arm64.exe
          path: tmd-windows-arm64.exe
