# ==============================================================================
# WORKFLOW: Manual PyPI Re-Publish / Fallback Sync
# ==============================================================================
# PURPOSE:
#   This workflow is an emergency / manual recovery tool to publish packages
#   to PyPI without re-running the entire multi-platform build matrix or
#   re-creating a GitHub Release.
#
# WHEN TO USE:
#   - PyPI publishing failed during an automated release run (e.g. OIDC exchange,
#     network timeout, or permission glitches).
#   - You need to manually sync or re-sync release distributions to PyPI for a
#     specific tag or the latest release.
#
# HOW TO RUN:
#   1. Go to "Actions" -> "Manual Re-Publish to PyPI (Fallback / Recovery)"
#   2. Click "Run workflow".
#   3. Optionally specify a release tag (e.g., "v1.0.0"). If left blank, it
#      automatically fetches the latest GitHub release.
# ==============================================================================

name: "Manual Re-Publish to PyPI (Fallback / Recovery)"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git release tag (leave empty for latest release)"
        required: false
        default: ""
        type: string
      skip_existing:
        description: "Skip packages that already exist on PyPI instead of erroring"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  republish-pypi:
    name: "Manual Re-Publish to PyPI"
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Target Release Tag
        id: get_tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            echo "Using specified tag: $TAG"
          else
            echo "Fetching latest release tag from GitHub..."
            TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "No GitHub release found via CLI, falling back to git tags..."
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            fi
            echo "Determined latest tag: $TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine release tag to publish."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Checking out code at tag: $TAG"
          git checkout "$TAG"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sync pyproject.toml with Release Tag
        shell: bash
        run: |
          TAG_VERSION="${{ steps.get_tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ -n "$TAG_VERSION" ]; then
            echo "Syncing pyproject.toml and source files to release tag version: $TAG_VERSION"
            python -c "import pathlib, re; p = pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'version\s*=\s*[\"\'][^\"\']+[\"\']', f'version = \"$TAG_VERSION\"', p.read_text(encoding='utf-8')), encoding='utf-8')"
            python scripts/sync_version.py
          fi

      - name: Build sdist and wheel
        shell: bash
        run: |
          pip install --upgrade build twine
          rm -rf dist/
          python -m build --outdir dist/

      - name: Publish to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: "true"
        run: |
          SKIP_FLAG=""
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            SKIP_FLAG="--skip-existing"
          fi
          twine upload $SKIP_FLAG dist/*.tar.gz dist/*.whl




