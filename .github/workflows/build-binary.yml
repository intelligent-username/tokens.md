name: Build Binaries

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-linux-x64:
    name: Build (Linux / x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-linux-x64

  build-linux-arm64:
    name: Build (Linux / ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-linux-arm64

  build-macos-x64:
    name: Build (macOS / x64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-macos-x64

  build-macos-arm64:
    name: Build (macOS / ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-macos-arm64

  build-windows-x64:
    name: Build (Windows / x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-windows-x64

  build-windows-arm64:
    name: Build (Windows / ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-windows-arm64
