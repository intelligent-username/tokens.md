name: Linting Checker

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend Linter (Ruff)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff checks (warning only)
        run: |
          uv run ruff check .
          uv run ruff format --check .

  frontend-lint:
    name: Frontend Linter (Prettier & ESLint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Prettier & ESLint checks (warning only)
        working-directory: frontend
        run: |
          npx prettier --check app components lib styles
          npm run lint
