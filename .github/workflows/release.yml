name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # 1. Mandatory check & verification gate (blocks release if checks/tests fail)
  check:
    uses: ./.github/workflows/check.yml

  # 2. Parallel binary builds (runs only after check passes)
  build-binaries:
    needs: check
    uses: ./.github/workflows/build-binary.yml

  # 3. Create GitHub Release once binaries are ready & auto-sync manifest SHA256 hashes
  github-release:
    name: Create GitHub Release & Update Manifests
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/github-release

  # 4. Publish Python distribution to PyPI
  pypi:
    name: Publish to PyPI
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-pypi
        with:
          pypi_token: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          skip_existing: "true"
    
  # 5. Publish to Chocolatey
  chocolatey:
    name: Publish to Chocolatey
    needs: github-release
    runs-on: windows-latest
    if: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/publish-chocolatey
        with:
          api_key: ${{ secrets.CHOCOLATEY_API_KEY }}

