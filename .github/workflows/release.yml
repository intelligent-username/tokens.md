name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.17)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  # 1. Mandatory check & verification gate (blocks release if checks/tests fail)
  check:
    uses: ./.github/workflows/check.yml

  # 2. Parallel binary builds (runs only after check passes)
  build-binaries:
    needs: check
    uses: ./.github/workflows/build-binary.yml

  # 3. Create GitHub Release once binaries are ready & auto-sync manifest SHA256 hashes
  github-release:
    name: Create GitHub Release & Update Manifests
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/github-release

  # 4. Publish Python distribution to PyPI
  pypi:
    name: Publish to PyPI
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-pypi
        with:
          pypi_token: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          skip_existing: "true"
    
  # 5. Publish to Chocolatey
  chocolatey:
    name: Publish to Chocolatey
    needs: github-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/publish-chocolatey
        if: ${{ env.CHOCOLATEY_API_KEY != '' }}
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        with:
          api_key: ${{ secrets.CHOCOLATEY_API_KEY }}

  # 6. Publish to Homebrew Tap
  homebrew:
    name: Publish to Homebrew Tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/publish-homebrew
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_GITHUB_TOKEN }}
        with:
          tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_GITHUB_TOKEN }}

  # 7. Publish to WinGet
  winget:
    name: Publish to WinGet
    needs: github-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/publish-winget
        if: ${{ env.WINGET_TOKEN != '' }}
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          winget_token: ${{ secrets.WINGET_TOKEN }}

  # 8. Publish to Scoop Bucket
  scoop:
    name: Publish to Scoop Bucket
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/publish-scoop
        if: ${{ env.SCOOP_TOKEN != '' }}
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.WINGET_TOKEN }}
        with:
          scoop_token: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.WINGET_TOKEN }}

  # 9. Publish to Arch User Repository (AUR)
  aur:
    name: Publish to AUR (Arch Linux)
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/publish-aur
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY || secrets.AUR_KEY }}
        with:
          aur_ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY || secrets.AUR_KEY }}
          pkgname: "tmd-bin"
          pkgbuild_path: "manifests/aur/PKGBUILD"

  # 10. Publish to MacPorts
  macports:
    name: Publish to MacPorts
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/publish-macports
        if: ${{ env.MACPORTS_TOKEN != '' }}
        env:
          MACPORTS_TOKEN: ${{ secrets.MACPORT_KEY || secrets.MACPORTS_TOKEN || secrets.MACPORT_TOKEN || secrets.WINGET_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_GITHUB_TOKEN }}
        with:
          macports_token: ${{ secrets.MACPORT_KEY || secrets.MACPORTS_TOKEN || secrets.MACPORT_TOKEN || secrets.WINGET_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_GITHUB_TOKEN }}





