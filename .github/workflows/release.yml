name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # for PyPI trusted publishing

jobs:
  # ── Binary builds ────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x64
            artifact: tmd-linux-x64
            exe: tmd-linux-x64

          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            artifact: tmd-linux-arm64
            exe: tmd-linux-arm64

          - runner: macos-latest    # Apple Silicon (short queue)
            os: macos
            arch: arm64
            artifact: tmd-macos-arm64
            exe: tmd-macos-arm64

          - runner: macos-13        # Intel
            os: macos
            arch: x64
            artifact: tmd-macos-x64
            exe: tmd-macos-x64

          - runner: windows-latest
            os: windows
            arch: x64
            artifact: tmd-windows-x64.exe
            exe: tmd-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── Compiler caches ──────────────────────────────────────────────────────

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ccache
          echo "CC=ccache gcc" >> $GITHUB_ENV
          echo "CXX=ccache g++" >> $GITHUB_ENV
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV
          echo "$(brew --prefix ccache)/libexec" >> $GITHUB_PATH

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/mozilla/sccache/releases/latest/download/sccache-v0.10.0-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile sccache.zip
          Expand-Archive sccache.zip -DestinationPath sccache-bin
          $sccachePath = (Get-ChildItem -Recurse sccache-bin -Filter sccache.exe).DirectoryName
          echo $sccachePath >> $env:GITHUB_PATH
          echo "SCCACHE_DIR=$env:LOCALAPPDATA\sccache" >> $env:GITHUB_ENV

      # ── Restore caches ───────────────────────────────────────────────────────

      # Nuitka-generated C source (avoids re-transpiling unchanged Python)
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            .nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      # Nuitka downloads: MinGW64 on Windows (~500 MB, ~10 min to download)
      - name: Cache Nuitka downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache/downloads
          key: nuitka-downloads-windows-x64
          restore-keys: nuitka-downloads-windows-

      # ccache: compiled C objects (Unix only)
      - name: Cache ccache (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      # sccache: compiled C objects (Windows / MSVC)
      - name: Cache sccache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\sccache
          key: sccache-windows-x64-${{ hashFiles('**/*.py', 'pyproject.toml') }}
          restore-keys: sccache-windows-x64-

      # ── Install Python deps ──────────────────────────────────────────────────

      - name: Install dependencies
        run: pip install nuitka ordered-set zstandard -e .

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m nuitka \
            --onefile \
            --output-filename=${{ matrix.exe }} \
            --include-package=src \
            --include-package=backend \
            --follow-imports \
            --assume-yes-for-downloads \
            --jobs=4 \
            --linux-onefile-icon=assets/tmd.png \
            tmd_runner.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ env.LOCALAPPDATA }}\sccache
        run: |
          sccache --start-server
          python -m nuitka `
            --onefile `
            --output-filename=${{ matrix.exe }} `
            --include-package=src `
            --include-package=backend `
            --follow-imports `
            --assume-yes-for-downloads `
            --jobs=4 `
            --windows-icon-from-ico=assets/tmd.ico `
            tmd_runner.py
          sccache --show-stats

      # ── Verify ──────────────────────────────────────────────────────────────

      - name: Smoke test
        shell: bash
        run: |
          ./${{ matrix.exe }} --version
          ./${{ matrix.exe }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  # ── PyPI publish ─────────────────────────────────────────────────────────────
  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
