name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # 1. Mandatory test suite gate (blocks release if tests fail)
  test:
    uses: ./.github/workflows/test.yml

  # 2. Non-blocking version check
  verify:
    uses: ./.github/workflows/verify.yml

  # 3. Parallel binary builds (runs only after test passes)
  build-binaries:
    needs: test
    uses: ./.github/workflows/build-binary.yml

  # 4. Create GitHub Release once binaries are ready & auto-sync manifest SHA256 hashes
  github-release:
    name: Create GitHub Release & Update Manifests
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Inject SHA-256 hashes into manifests
        run: |
          python scripts/update_manifest_hashes.py

      - name: Commit updated manifests back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(release): auto-sync manifest SHA-256 hashes for release"
            git push origin HEAD:main
          fi

  # 5. Publish to PyPI
  pypi:
    name: Publish to PyPI
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}


