# ==============================================================================
# WORKFLOW: Manual WinGet Re-Publish / Fallback Sync
# ==============================================================================
# PURPOSE:
#   Directly submit package release update to microsoft/winget-pkgs using
#   WINGET_TOKEN.
#
# HOW TO RUN:
#   1. Go to "Actions" -> "Manual Re-Publish to WinGet (Fallback / Recovery)"
#   2. Click "Run workflow".
# ==============================================================================

name: "Manual Re-Publish to WinGet (Fallback / Recovery)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  republish-winget:
    name: "Manual Re-Publish to WinGet"
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Publish to WinGet
        uses: ./.github/actions/publish-winget
        with:
          winget_token: ${{ secrets.WINGET_TOKEN }}
