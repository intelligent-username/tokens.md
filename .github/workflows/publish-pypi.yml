name: Publish to PyPI

on:
  workflow_call:

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sync pyproject.toml with Release Tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$GITHUB_REF" ]; then
            echo "Syncing pyproject.toml and source files to release tag version: $TAG_VERSION"
            python -c "import pathlib, re; p = pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'version\s*=\s*[\"\'][^\"\']+[\"\']', f'version = \"$TAG_VERSION\"', p.read_text(encoding='utf-8')), encoding='utf-8')"
            python scripts/sync_version.py
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          skip-existing: true


