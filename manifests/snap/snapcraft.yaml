name: tmd
version: "0.0.18"
summary: Convert files to token-efficient Markdown for LLM prompts
description: |
  tmd converts PDF, DOCX, PPTX, XLSX, ODT, EPUB, MOBI, HTML, JSON, CSV,
  LaTeX, e-mail, subtitles, Jupyter notebooks, and whole code repositories
  into clean, token-efficient Markdown for LLM context windows.

  Features: batch conversion, clipboard copy, hot-folder watching,
  web page fetching, repo manifests, token budgeting, and a local web UI.
grade: stable
confinement: strict
base: core22
license: AGPL-3.0

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  tmd:
    command: bin/tmd
    plugs:
      - home
      - removable-media
      - network

parts:
  tmd-amd64:
    plugin: dump
    source: https://github.com/intelligent-username/tokens.md/releases/download/v0.0.18/tmd-linux-x64
    source-type: file
    stage-packages:
      - on amd64:
          - libc6
    organize:
      tmd-linux-x64: bin/tmd
    stage:
      - bin/tmd

  tmd-arm64:
    plugin: dump
    source: https://github.com/intelligent-username/tokens.md/releases/download/v0.0.18/tmd-linux-arm64
    source-type: file
    stage-packages:
      - on arm64:
          - libc6
    organize:
      tmd-linux-arm64: bin/tmd
    stage:
      - bin/tmd
