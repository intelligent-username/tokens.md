[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokens-md"
version = "0.2.0"
description = "Convert files to token-efficient Markdown for LLM prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tokens.md" }]
dependencies = [
    "pymupdf4llm",
    "typer>=0.12",
    "rich",
    "pyperclip",
    "watchdog",
    "trafilatura",
    "pathspec",
    "sumy",
    "tiktoken",
    "python-docx>=1.2",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "striprtf>=0.0.26",
    "extract-msg>=0.48",
    "mobi>=0.3.3",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-instafail",
    "ruff",
    "mypy",
    "httpx2",
]
web = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
tmd = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "backend"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"