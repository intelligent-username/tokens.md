[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokens-md"
version = "0.0.18"
description = "Convert files to token-efficient Markdown for LLM prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "tokens.md" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "typer>=0.12",
    "rich",
    "pyperclip",
    "watchdog",
    "trafilatura",
    "pathspec",
    "sumy",
    "tiktoken",
    "python-docx>=1.2",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "mathml-to-latex>=1.0",
    "striprtf>=0.0.26",
    "extract-msg>=0.48",
    "mobi>=0.3.3",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "ruff>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-instafail",
    "ruff",
    "mypy",
    "httpx",
]
web = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
tmd = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "backend", "tmd_ui_static"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "scripts",
    "frontend",
    "temp",
    "docs",
    ".prettierrc",
    ".prettierignore",
    ".eslintrc.json",
    ".eslintignore",
    "vitest.config.ts",
]

[tool.ruff]
line-length = 300
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # FastAPI/Typer defaults (File, Form, Option)
    "B904",   # Raise from err
    "B905",   # zip() strict parameter requirement
    "SIM105", # Use contextlib.suppress
    "SIM108", # Use ternary operator
    "UP031",  # Percent format specifiers
    "E741",   # Ambiguous variable name
    "E731",   # Lambda expression assignment
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore:.*starlette.testclient.*:Warning",
    "ignore:.*httpx.*:Warning",
    "ignore::Warning:fastapi.testclient",
    "ignore::Warning:starlette.*",
]

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "tmd_runner.py"]

[tool.coverage.report]
# Show a percentage summary line at the end of every pytest run.
show_missing = false
skip_covered = true
precision = 0

[tool.nuitka]
onefile = true
output-filename = "tmd"
include-package = ["src", "backend"]
follow-imports = true
assume-yes-for-downloads = true
windows-icon-from-ico = "assets/tmd.ico"
macos-app-name = "tmd"
linux-onefile-icon = "assets/tmd.png"