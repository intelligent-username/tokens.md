[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokens-md"
version = "0.0.5"
description = "Convert files to token-efficient Markdown for LLM prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3." }
authors = [{ name = "tokens.md" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf4llm",
    "typer>=0.12",
    "rich",
    "pyperclip",
    "watchdog",
    "trafilatura",
    "pathspec",
    "sumy",
    "tiktoken",
    "python-docx>=1.2",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "mathml-to-latex>=1.0",
    "striprtf>=0.0.26",
    "extract-msg>=0.48",
    "mobi>=0.3.3",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-instafail",
    "ruff",
    "mypy",
    "httpx",
]
web = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
tmd = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "backend", "tmd_ui_static"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.nuitka]
onefile = true
output-filename = "tmd"
include-package = ["src", "backend"]
follow-imports = true
assume-yes-for-downloads = true
windows-icon-from-ico = "assets/tmd.ico"
macos-app-name = "tmd"
linux-onefile-icon = "assets/tmd.png"